name: Sync Footer & Sitemap

on:
  push:
    branches: [ main ]
    paths:
      - 'partials/footer.html'
      - '**/*.html'
      - 'build-footer.py'
      - 'build-sitemap.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run footer sync
        run: python3 build-footer.py

      - name: Regenerate sitemap
        run: python3 build-sitemap.py

      - name: Commit updates (if any)
        run: |
          git config user.name "footer-sync-bot"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync footer & sitemap [skip ci]"
            git push
          else
            echo "No changes needed."
          fi
