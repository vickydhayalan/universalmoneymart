name: Sync Footer

on:
  push:
    branches: [ main ]
    paths:
      - 'partials/footer.html'
      - '**/*.html'
      - 'build-footer.py'

permissions:
  contents: write

jobs:
  sync-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run footer sync
        run: python3 build-footer.py

      - name: Commit updated footers (if any)
        run: |
          git config user.name "footer-sync-bot"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync footer across pages [skip ci]"
            git push
          else
            echo "No footer changes needed."
          fi
