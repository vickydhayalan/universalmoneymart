<!DOCTYPE html>
<html lang="ta" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>D-FARM POLUR | Farm Direct Quick Store</title>
  <meta name="theme-color" content="#143627">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" href="https://iili.io/nPh3Ia9.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-val { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Left sidebar active category highlight */
    .cat-rail-item.active {
      background-color: #EBF7EE;
      color: #0F5132;
      border-right: 3.5px solid #0F5132;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-[#F4F6F8] text-slate-800 h-full flex flex-col antialiased select-none">

  <!-- ==================== TOP APP HEADER (Zepto Style) ==================== -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-3.5 py-2.5 shadow-sm">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
      
      <!-- Back to Farm Home & Location Info -->
      <div class="flex items-center gap-2.5 min-w-0">
        <a href="../dfarm.html" class="p-2 rounded-full hover:bg-slate-100 text-slate-700 transition flex-shrink-0" title="Back to Farm Home">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="font-extrabold text-sm text-[#143627] tracking-tight">D-FARM DIRECT</span>
            <span class="text-[9px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.2 rounded font-mono-val">POLUR</span>
          </div>
          <p class="text-[11px] text-slate-500 font-medium truncate flex items-center gap-1">
            <span>Delivering fresh in Polur</span>
            <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400"></i>
          </p>
        </div>
      </div>

      <!-- Search & Cart Trigger -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <button onclick="openSearchModal()" class="p-2 rounded-full hover:bg-slate-100 text-slate-600 transition" aria-label="Search">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>
        <button onclick="toggleCartDrawer(true)" class="relative p-2 rounded-full bg-emerald-50 text-emerald-900 transition flex items-center justify-center">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span id="headerCartCount" class="absolute -top-1 -right-1 bg-[#143627] text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center font-mono-val">0</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ==================== MAIN QUICK COMMERCE APP VIEW ==================== -->
  <div class="flex-1 max-w-5xl w-full mx-auto flex overflow-hidden">
    
    <!-- LEFT CATEGORY RAIL (Zepto Circular Icon Sidebar) -->
    <aside class="w-20 sm:w-24 bg-white border-r border-slate-200 overflow-y-auto no-scrollbar py-2 flex flex-col flex-shrink-0">
      
      <button onclick="switchCategory('all')" id="cat-all" class="cat-rail-item active py-3 px-1 flex flex-col items-center gap-1 text-center transition">
        <div class="w-11 h-11 rounded-full bg-emerald-50 border border-emerald-200 flex items-center justify-center text-lg">🌾</div>
        <span class="text-[10px] leading-tight">All Items</span>
      </button>

      <button onclick="switchCategory('dairy')" id="cat-dairy" class="cat-rail-item py-3 px-1 flex flex-col items-center gap-1 text-center transition">
        <div class="w-11 h-11 rounded-full bg-blue-50 border border-blue-200 flex items-center justify-center text-lg">🥛</div>
        <span class="text-[10px] leading-tight">Milk & Dairy</span>
      </button>

      <button onclick="switchCategory('eggs')" id="cat-eggs" class="cat-rail-item py-3 px-1 flex flex-col items-center gap-1 text-center transition">
        <div class="w-11 h-11 rounded-full bg-amber-50 border border-amber-200 flex items-center justify-center text-lg">🥚</div>
        <span class="text-[10px] leading-tight">Country Eggs</span>
      </button>

      <button onclick="switchCategory('oils')" id="cat-oils" class="cat-rail-item py-3 px-1 flex flex-col items-center gap-1 text-center transition">
        <div class="w-11 h-11 rounded-full bg-yellow-50 border border-yellow-200 flex items-center justify-center text-lg">🛢️</div>
        <span class="text-[10px] leading-tight">Chekku Oils</span>
      </button>

      <button onclick="switchCategory('produce')" id="cat-produce" class="cat-rail-item py-3 px-1 flex flex-col items-center gap-1 text-center transition">
        <div class="w-11 h-11 rounded-full bg-emerald-50 border border-emerald-200 flex items-center justify-center text-lg">🥥</div>
        <span class="text-[10px] leading-tight">Farm Produce</span>
      </button>

      <button onclick="switchCategory('manures')" id="cat-manures" class="cat-rail-item py-3 px-1 flex flex-col items-center gap-1 text-center transition">
        <div class="w-11 h-11 rounded-full bg-stone-50 border border-stone-200 flex items-center justify-center text-lg">🌱</div>
        <span class="text-[10px] leading-tight">Manures & Fodder</span>
      </button>

    </aside>

    <!-- RIGHT SCROLLABLE PRODUCTS GRID -->
    <main class="flex-1 bg-[#F8FAFC] overflow-y-auto px-3 sm:px-5 py-4 pb-28">
      
      <!-- Category Banner / Promo -->
      <div id="categoryBanner" class="bg-gradient-to-r from-[#143627] to-[#1E4D38] text-white p-3.5 rounded-2xl mb-4 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-[9px] font-bold uppercase tracking-wider text-amber-300 font-mono-val">100% UNADULTERATED DIRECT HARVEST</span>
          <h2 id="currentCategoryTitle" class="text-base sm:text-lg font-extrabold leading-tight">Fresh picks at farm-gate prices</h2>
        </div>
        <span class="text-2xl">🌱</span>
      </div>

      <!-- 2-Column Product Cards Grid (Matching Screenshot) -->
      <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 sm:gap-4">
        <!-- Injected via JavaScript -->
      </div>

    </main>

  </div>

  <!-- ==================== STICKY BOTTOM QUICK-COMMERCE CART BAR ==================== -->
  <div id="stickyCartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2.5 z-40 shadow-[0_-4px_16px_rgba(0,0,0,0.08)] hidden">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-900 flex items-center justify-center font-bold font-mono-val">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5 font-mono-val">
            <span id="barTotalItems" class="text-xs font-bold text-slate-800">0 Items</span>
            <span class="text-slate-300">•</span>
            <span id="barTotalPrice" class="text-sm font-extrabold text-[#143627]">₹0</span>
          </div>
          <p class="text-[10px] text-emerald-700 font-semibold">Direct Polur farm supply</p>
        </div>
      </div>

      <button onclick="toggleCartDrawer(true)" class="bg-[#143627] hover:bg-[#0E271C] active:scale-95 text-white font-bold text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow-md transition flex items-center gap-1.5">
        <span>View Cart</span>
        <i data-lucide="arrow-right" class="w-4 h-4 text-amber-300"></i>
      </button>
    </div>
  </div>

  <!-- ==================== FULL CART & CHECKOUT DRAWER ==================== -->
  <div id="cartDrawer" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col justify-between shadow-2xl">
      
      <!-- Cart Drawer Header -->
      <div class="p-4 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-emerald-100 text-[#143627] flex items-center justify-center">
            <i data-lucide="shopping-cart" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="font-bold text-sm text-slate-900">Your Farm Cart</h3>
            <span id="drawerItemsCount" class="text-[10px] text-slate-500 font-mono-val">0 Items</span>
          </div>
        </div>
        <button onclick="toggleCartDrawer(false)" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Cart Items Scroll List -->
      <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Injected via JS -->
      </div>

      <!-- Checkout Form & Payment Actions -->
      <div class="p-4 border-t border-slate-200 bg-slate-50 space-y-3">
        
        <!-- Customer Details -->
        <div class="space-y-2 text-xs">
          <input type="text" id="custName" placeholder="உங்கள் பெயர் (Your Name)*" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs outline-none focus:border-emerald-700">
          <input type="tel" id="custPhone" placeholder="WhatsApp Mobile (10 Digits)*" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs outline-none focus:border-emerald-700 font-mono-val">
          <input type="text" id="custAddress" placeholder="போளூர் முகவரி / Landmark (Polur Address)*" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs outline-none focus:border-emerald-700">
        </div>

        <!-- Bill Details -->
        <div class="bg-white rounded-xl p-3 border border-slate-200 text-xs space-y-1.5 font-mono-val">
          <div class="flex justify-between text-slate-600">
            <span>Item Total</span>
            <span id="billSubtotal">₹0</span>
          </div>
          <div class="flex justify-between text-emerald-700 font-semibold">
            <span>Farm Handling & Packaging</span>
            <span>FREE</span>
          </div>
          <div class="flex justify-between font-bold text-sm text-[#143627] pt-1.5 border-t border-slate-100">
            <span>To Pay (Grand Total)</span>
            <span id="billGrandTotal">₹0</span>
          </div>
        </div>

        <!-- Order Triggers -->
        <div class="space-y-2">
          <button onclick="placeOrderWhatsApp()" class="w-full bg-[#143627] hover:bg-[#0E271C] active:scale-95 text-white font-bold py-3 rounded-xl shadow flex items-center justify-center gap-2 text-xs transition">
            <i data-lucide="message-circle" class="w-4 h-4 text-emerald-400"></i>
            <span>Confirm Order via WhatsApp</span>
          </button>
          <button onclick="payViaUPI()" class="w-full bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold py-2.5 rounded-xl shadow flex items-center justify-center gap-2 text-xs font-mono-val transition">
            <i data-lucide="qr-code" class="w-4 h-4"></i>
            <span>Instant Pay via UPI (7200752628@upi)</span>
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- ==================== SEARCH MODAL ==================== -->
  <div id="searchModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-start justify-center pt-16 px-4">
    <div class="bg-white w-full max-w-lg rounded-2xl p-4 shadow-2xl space-y-3">
      <div class="flex items-center gap-2 border-b border-slate-200 pb-2">
        <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
        <input type="text" id="storeSearchInput" oninput="handleLiveSearch()" placeholder="Search milk, coconut oil, eggs..." class="w-full text-xs sm:text-sm outline-none">
        <button onclick="closeSearchModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div id="searchResults" class="max-h-60 overflow-y-auto space-y-2 text-xs">
        <p class="text-slate-400 text-center py-4">Type to search farm items...</p>
      </div>
    </div>
  </div>

  <!-- ==================== JAVASCRIPT APP LOGIC ==================== -->
  <script>
    // D-FARM Official Product Catalog
    const farmInventory = [
      { id: 101, name: "Raw Cow Milk (Glass Bottle)", category: "dairy", weight: "1 Litre", price: 60, mrp: 70, img: "https://iili.io/nPhGB5P.jpg", badge: "Morning Batch" },
      { id: 102, name: "Raw Cow Milk (Fresh Pouch)", category: "dairy", weight: "1 Litre", price: 50, mrp: 55, img: "https://iili.io/nPh8YPI.jpg", badge: "Daily Pouch" },
      { id: 103, name: "Free-Range Country Eggs", category: "eggs", weight: "Box of 6", price: 72, mrp: 85, img: "https://iili.io/nPjJdHg.jpg", badge: "Organic" },
      { id: 104, name: "Marachekku Coconut Oil", category: "oils", weight: "1 Litre", price: 260, mrp: 290, img: "https://iili.io/nPPShba.jpg", badge: "Wood-Pressed" },
      { id: 105, name: "Marachekku Groundnut Oil", category: "oils", weight: "1 Litre", price: 210, mrp: 235, img: "https://iili.io/nPinmaj.jpg", badge: "Wood-Pressed" },
      { id: 106, name: "Fresh Farm Coconuts", category: "produce", weight: "1 Piece", price: 30, mrp: 35, img: "https://iili.io/nPPMuj9.jpg", badge: "Farm Pick" },
      { id: 107, name: "Raw Red Groundnuts", category: "produce", weight: "1 kg Pack", price: 90, mrp: 105, img: "https://iili.io/nPPmU2n.jpg", badge: "Polur Soil" },
      { id: 108, name: "Fresh Veggie Harvest Basket", category: "produce", weight: "Basket (~2.5kg)", price: 120, mrp: 145, img: "https://iili.io/nPiN3kG.jpg", badge: "No Chemicals" },
      { id: 109, name: "Aged Cow Dung Compost", category: "manures", weight: "25kg Bag", price: 250, mrp: 280, img: "https://iili.io/nPjFV3B.jpg", badge: "Natural NPK" },
      { id: 110, name: "Goat Manure Pellets", category: "manures", weight: "10kg Bag", price: 150, mrp: 175, img: "https://iili.io/nPjTtYG.jpg", badge: "Rich Fertilizer" },
      { id: 111, name: "Super Napier Grass Stems", category: "manures", weight: "100 Stems Bundle", price: 100, mrp: 120, img: "https://iili.io/nPjdrve.jpg", badge: "High Yield" }
    ];

    // LocalStorage Persistent Cart
    let cart = JSON.parse(localStorage.getItem('dfarm_cart') || '{}');
    let currentCategory = 'all';

    function saveCart() {
      localStorage.setItem('dfarm_cart', JSON.stringify(cart));
      updateCartUI();
    }

    // Render Product Cards (Zepto Style)
    function renderProductGrid(items) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = items.map(item => {
        const qty = cart[item.id] || 0;
        const discountPct = Math.round(((item.mrp - item.price) / item.mrp) * 100);

        return `
          <div class="bg-white rounded-2xl p-2.5 sm:p-3 border border-slate-200/80 shadow-sm flex flex-col justify-between relative group hover:border-emerald-300 transition">
            
            <!-- Veg Icon & Discount Tag -->
            <div class="flex items-center justify-between mb-1">
              <span class="w-3.5 h-3.5 border border-emerald-600 p-0.5 rounded flex items-center justify-center">
                <span class="w-1.5 h-1.5 bg-emerald-600 rounded-full"></span>
              </span>
              <span class="text-[9px] font-bold text-emerald-800 bg-emerald-50 px-1.5 py-0.5 rounded font-mono-val">${discountPct}% OFF</span>
            </div>

            <!-- Product Image -->
            <div class="h-28 sm:h-36 rounded-xl flex items-center justify-center p-1.5 relative overflow-hidden">
              <img src="${item.img}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://placehold.co/200x200/143627/FFFFFF?text=${encodeURIComponent(item.name)}';" class="h-full object-contain group-hover:scale-105 transition duration-300" alt="${item.name}">
            </div>

            <!-- Weight & Name -->
            <div class="mt-2 space-y-0.5">
              <span class="text-[10px] font-semibold text-slate-500 font-mono-val block">${item.weight}</span>
              <h3 class="text-xs font-bold text-slate-900 leading-snug line-clamp-2 h-8">${item.name}</h3>
            </div>

            <!-- Price & Dynamic ADD / Stepper Button -->
            <div class="mt-2.5 flex items-center justify-between pt-1">
              <div>
                <div class="flex items-baseline gap-1 font-mono-val">
                  <span class="text-xs sm:text-sm font-extrabold text-[#143627]">₹${item.price}</span>
                  <span class="text-[10px] text-slate-400 line-through">₹${item.mrp}</span>
                </div>
              </div>

              <!-- Button Switch: ADD vs - QTY + -->
              <div class="w-16 sm:w-20">
                ${qty === 0 ? `
                  <button onclick="updateItemQty(${item.id}, 1)" class="w-full bg-white hover:bg-emerald-50 text-emerald-800 border-2 border-emerald-700 font-extrabold text-[11px] py-1 rounded-xl uppercase tracking-wider shadow-sm transition active:scale-95">
                    ADD
                  </button>
                ` : `
                  <div class="w-full bg-[#143627] text-white flex items-center justify-between rounded-xl px-1.5 py-1 text-xs font-mono-val font-bold shadow">
                    <button onclick="updateItemQty(${item.id}, -1)" class="w-5 h-5 flex items-center justify-center text-amber-200 active:scale-90">-</button>
                    <span class="text-xs">${qty}</span>
                    <button onclick="updateItemQty(${item.id}, 1)" class="w-5 h-5 flex items-center justify-center text-amber-200 active:scale-90">+</button>
                  </div>
                `}
              </div>
            </div>

          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // Switch Left Categories
    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-rail-item').forEach(el => el.classList.remove('active'));
      const activeBtn = document.getElementById(`cat-${cat}`);
      if (activeBtn) activeBtn.classList.add('active');

      const titles = {
        all: "Fresh picks at farm-gate prices",
        dairy: "Unadulterated Raw Cow Milk & Dairy",
        eggs: "Free-Range Natural Country Eggs",
        oils: "Traditional Wood-Pressed Pure Oils",
        produce: "Organic Coconuts & Raw Harvest",
        manures: "Aged Manures & Super Napier Pastures"
      };
      document.getElementById('currentCategoryTitle').textContent = titles[cat] || "Farm Direct Products";

      const filtered = cat === 'all' ? farmInventory : farmInventory.filter(i => i.category === cat);
      renderProductGrid(filtered);
    }

    // Cart Quantity Management
    function updateItemQty(id, delta) {
      const current = cart[id] || 0;
      const next = current + delta;
      if (next <= 0) {
        delete cart[id];
      } else {
        cart[id] = next;
      }
      saveCart();
      const currentItems = currentCategory === 'all' ? farmInventory : farmInventory.filter(i => i.category === currentCategory);
      renderProductGrid(currentItems);
    }

    // Update Bottom Bar & Drawer
    function updateCartUI() {
      const entries = Object.entries(cart);
      let totalQty = 0;
      let totalPrice = 0;

      entries.forEach(([id, qty]) => {
        const product = farmInventory.find(p => p.id === parseInt(id));
        if (product) {
          totalQty += qty;
          totalPrice += product.price * qty;
        }
      });

      // Header Badge
      document.getElementById('headerCartCount').textContent = totalQty;

      // Bottom Bar
      const stickyBar = document.getElementById('stickyCartBar');
      if (totalQty > 0) {
        stickyBar.classList.remove('hidden');
        document.getElementById('barTotalItems').textContent = `${totalQty} Item${totalQty > 1 ? 's' : ''}`;
        document.getElementById('barTotalPrice').textContent = `₹${totalPrice.toLocaleString('en-IN')}`;
      } else {
        stickyBar.classList.add('hidden');
      }

      // Drawer Container
      document.getElementById('drawerItemsCount').textContent = `${totalQty} Items`;
      document.getElementById('billSubtotal').textContent = `₹${totalPrice.toLocaleString('en-IN')}`;
      document.getElementById('billGrandTotal').textContent = `₹${totalPrice.toLocaleString('en-IN')}`;

      const drawerList = document.getElementById('cartItemsContainer');
      if (totalQty === 0) {
        drawerList.innerHTML = `
          <div class="text-center py-16 text-slate-400 space-y-2">
            <i data-lucide="shopping-bag" class="w-10 h-10 mx-auto text-slate-300"></i>
            <p class="text-xs font-mono-val">உங்கள் கூடை காலியாக உள்ளது (Cart is empty)</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      drawerList.innerHTML = entries.map(([id, qty]) => {
        const item = farmInventory.find(p => p.id === parseInt(id));
        if (!item) return '';
        return `
          <div class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono-val text-xs">
            <div class="flex items-center gap-2.5">
              <img src="${item.img}" referrerpolicy="no-referrer" class="w-10 h-10 object-contain rounded-lg bg-white border p-1" alt="${item.name}">
              <div>
                <h4 class="font-bold text-slate-900 font-sans text-xs line-clamp-1">${item.name}</h4>
                <span class="text-[11px] text-emerald-800 font-semibold">₹${item.price} each</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 bg-white border border-slate-300 rounded-lg px-1.5 py-0.5">
              <button onclick="updateItemQty(${item.id}, -1)" class="w-5 h-5 text-slate-700 font-bold">-</button>
              <span class="font-bold w-4 text-center">${qty}</span>
              <button onclick="updateItemQty(${item.id}, 1)" class="w-5 h-5 text-emerald-800 font-bold">+</button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function toggleCartDrawer(show) {
      const drawer = document.getElementById('cartDrawer');
      if (show) {
        drawer.classList.remove('hidden');
      } else {
        drawer.classList.add('hidden');
      }
    }

    // Place Order via WhatsApp
    function placeOrderWhatsApp() {
      const entries = Object.entries(cart);
      if (!entries.length) {
        alert("உங்கள் கூடை காலியாக உள்ளது!");
        return;
      }
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();

      if (!name || !phone || !address) {
        alert("தயவுசெய்து உங்கள் பெயர், மொபைல் எண் மற்றும் போளூர் முகவரியை உள்ளிடவும்.");
        return;
      }

      let summary = "";
      let grandTotal = 0;
      entries.forEach(([id, qty]) => {
        const item = farmInventory.find(p => p.id === parseInt(id));
        if (item) {
          summary += `• ${item.name} (${item.weight}) x ${qty} = ₹${item.price * qty}\n`;
          grandTotal += item.price * qty;
        }
      });

      const message = `*🌾 D-FARM POLUR • QUICK STORE ORDER*\n----------------------------------------\n*Customer Details:*\n👤 Name: ${name}\n📱 Phone: ${phone}\n📍 Delivery Address: ${address}\n----------------------------------------\n*Order Items:*\n${summary}----------------------------------------\n*Grand Total: ₹${grandTotal}*\n\nPlease confirm availability and delivery slot in Polur!`;

      window.open(`https://wa.me/917200752628?text=${encodeURIComponent(message)}`, '_blank');
    }

    function payViaUPI() {
      const entries = Object.entries(cart);
      if (!entries.length) {
        alert("உங்கள் கூடை காலியாக உள்ளது!");
        return;
      }
      let grandTotal = 0;
      entries.forEach(([id, qty]) => {
        const item = farmInventory.find(p => p.id === parseInt(id));
        if (item) grandTotal += item.price * qty;
      });

      prompt(`D-FARM Instant UPI Payment ID:\n7200752628@upi\nTotal Amount: ₹${grandTotal}\n\nCopy UPI ID to pay via GPay / PhonePe / Paytm:`, "7200752628@upi");
    }

    // Search Functions
    function openSearchModal() {
      document.getElementById('searchModal').classList.remove('hidden');
      document.getElementById('storeSearchInput').focus();
    }
    function closeSearchModal() {
      document.getElementById('searchModal').classList.add('hidden');
    }

    function handleLiveSearch() {
      const q = document.getElementById('storeSearchInput').value.toLowerCase().trim();
      const target = document.getElementById('searchResults');
      if (!q) {
        target.innerHTML = `<p class="text-slate-400 text-center py-4">Type to search farm items...</p>`;
        return;
      }
      const matched = farmInventory.filter(i => i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q));
      if (!matched.length) {
        target.innerHTML = `<p class="text-slate-400 text-center py-4">No products found matching "${q}".</p>`;
        return;
      }
      target.innerHTML = matched.map(m => `
        <div onclick="addToCartFromSearch(${m.id})" class="flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 cursor-pointer border border-slate-100">
          <div class="flex items-center gap-2">
            <img src="${m.img}" class="w-8 h-8 object-contain">
            <span class="font-bold text-xs">${m.name} (${m.weight})</span>
          </div>
          <span class="font-mono-val font-bold text-emerald-800 text-xs">₹${m.price}</span>
        </div>
      `).join('');
    }

    function addToCartFromSearch(id) {
      updateItemQty(id, 1);
      closeSearchModal();
    }

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      switchCategory('all');
      updateCartUI();
    });
  </script>
</body>
</html>
